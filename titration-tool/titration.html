<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抗癫痫药物滴定方案生成器</title>
<style>
/* ========== 基础样式（目前只含横幅与测试区，输出样式在第 3/4 步加入） ========== */
* { box-sizing: border-box; }
body {
  margin: 0; color: #111; background: #f5f5f5;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 16px; line-height: 1.5;
}
main { max-width: 960px; margin: 0 auto; padding: 12px; }
h1 { font-size: 20px; margin: 12px 0 4px; }
h2 { font-size: 17px; margin: 20px 0 8px; }
.muted { color: #555; font-size: 13px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin: 12px 0; }

/* 演示数据红色横幅：始终置顶，打印时也保留 */
.banner {
  position: sticky; top: 0; z-index: 10;
  background: #c00; color: #fff; font-weight: 700; text-align: center;
  padding: 8px 12px; font-size: 16px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
[hidden] { display: none !important; }

/* 测试区 */
.t-summary { font-weight: 700; padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
.t-summary.ok { background: #e3f4e3; color: #145214; }
.t-summary.bad { background: #fde4e4; color: #8a0000; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
table.t th, table.t td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
table.t th { background: #eee; }
table.t td:nth-child(1), table.t td:nth-child(3) { white-space: nowrap; }
.st-pass { color: #145214; font-weight: 700; }
.st-fail { color: #b00000; font-weight: 700; }
.fx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fx pre { margin: 0; padding: 6px; background: #fafafa; border: 1px solid #ccc; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.fx .diff { background: #fde4e4; }
@media (max-width: 600px) { .fx { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="demo-banner" class="banner" hidden>⚠ 当前载入演示数据，数值为虚构，严禁用于临床</div>

<main>
  <h1>抗癫痫药物滴定方案生成器</h1>
  <div class="muted">版本 <span id="ver"></span> ｜ 本工具不存储任何数据，刷新页面即清空</div>

  <!-- 输入区与输出区：第 3、4 步实现 -->
  <section id="app" class="card">
    <div class="muted">（输入区、医生版、患者版将在第 3、4 步实现。当前已完成第 2 步：四个计算函数 + 测试。网址末尾加 <code>?test=1</code> 查看测试区。）</div>
  </section>

  <!-- 页内测试区：仅在 ?test=1 时显示 -->
  <section id="test-area" hidden>
    <h2>单元测试</h2>
    <div id="t-summary"></div>
    <div id="t-results"></div>
    <h2>说明书标准方案对照（FIXTURES）：期望 vs 实际</h2>
    <div id="fx-results"></div>
  </section>
</main>

<script>
"use strict";

/* =====================================================================
 * 一、版本与开关
 * ===================================================================== */
const TOOL_VERSION = "0.2.0-step2";

// 是否载入演示数据。正式数据核对填写完成后改为 false，演示药与红色横幅即消失。
const LOAD_DEMO_DATA = true;

/* =====================================================================
 * 二、正式药物数据（由使用者对照药品说明书手工填写）
 *
 * ！！！本区所有数值必须来自说明书核对，不得凭记忆填写 ！！！
 * - 数值位置一律为 null，填写并核对后再把 dataVerified 改为 true
 * - id 为空的条目视为模板，不会出现在界面上
 * - 新增药物：复制下面整个对象，逐项填写
 * ===================================================================== */
const DRUGS = [{
  id: "",
  nameCn: "", nameEn: "", brandCn: [],
  strengths: [],            // 国内可得规格(mg)
  splittable: null,         // 药片可否分割（true/false）
  allowAlternateDay: null,  // 可否隔日服（true/false）
  weightBased: null,        // 是否按体重给药（true/false）
  titrationPaths: [{
    scenario: "",           // monotherapy | withInhibitor | withInducer | custom
    label: "",              // 中文说明，显示给医生
    steps: [{ weekFrom: null, weekTo: null, dailyDose: null, dosesPerDay: null, note: "" }],
    escalation: { amount: null, everyWeeks: null }, // 固定步骤走完后的递增规则
    maintenanceRange: [null, null]
  }],
  cautions: [],
  sources: [{ type: "", name: "", version: "", date: "" }], // 数据来源，用于论文 Methods
  dataVerified: false
}];

// 合并用药 → 情境判定用的药物分类表。同样留空待填。
// 每项格式：{ id: "", nameCn: "" }
const INTERACTION_CLASSES = { inducers: [], inhibitors: [], neutral: [] };

/* =====================================================================
 * 三、演示数据（全部虚构，仅用于跑通流程和测试，严禁用于临床）
 * 药名用"演示药X"，数值用 5/10/20/30 这类一眼假的整数。
 * ===================================================================== */
const DEMO_SOURCE = [{ type: "演示", name: "虚构数据，不对应任何药品说明书", version: "-", date: "-" }];

const DEMO_DRUGS = [{
  // 演示药A：不可掰、允许隔日、三条情境分支齐全
  id: "demoA", isDemo: true,
  nameCn: "演示药A", nameEn: "Demo Drug A", brandCn: ["演示牌A"],
  strengths: [10, 20], splittable: false, allowAlternateDay: true, weightBased: false,
  titrationPaths: [{
    scenario: "monotherapy", label: "演示：单药方案",
    steps: [
      { weekFrom: 1, weekTo: 2, dailyDose: 10, dosesPerDay: 1, note: "" },
      { weekFrom: 3, weekTo: 4, dailyDose: 20, dosesPerDay: 2, note: "" }
    ],
    escalation: { amount: 20, everyWeeks: 1 },
    maintenanceRange: [40, 80]
  }, {
    scenario: "withInhibitor", label: "演示：合用抑制剂（放慢）",
    steps: [
      { weekFrom: 1, weekTo: 2, dailyDose: 5, dosesPerDay: 1, note: "演示：低于最小规格，需隔日服" },
      { weekFrom: 3, weekTo: 4, dailyDose: 10, dosesPerDay: 1, note: "" }
    ],
    escalation: { amount: 10, everyWeeks: 2 },
    maintenanceRange: [20, 40]
  }, {
    scenario: "withInducer", label: "演示：合用诱导剂（加快）",
    steps: [
      { weekFrom: 1, weekTo: 2, dailyDose: 20, dosesPerDay: 1, note: "" },
      { weekFrom: 3, weekTo: 4, dailyDose: 40, dosesPerDay: 2, note: "" }
    ],
    escalation: { amount: 40, everyWeeks: 1 },
    maintenanceRange: [80, 160]
  }],
  cautions: ["演示注意事项：本条为虚构"],
  sources: DEMO_SOURCE,
  dataVerified: false
}, {
  // 演示药B：单一规格、可掰半、不允许隔日、只有单药方案（用于测"无对应情境方案"）
  id: "demoB", isDemo: true,
  nameCn: "演示药B", nameEn: "Demo Drug B", brandCn: [],
  strengths: [30], splittable: true, allowAlternateDay: false, weightBased: false,
  titrationPaths: [{
    scenario: "monotherapy", label: "演示：单药方案",
    steps: [
      { weekFrom: 1, weekTo: 1, dailyDose: 15, dosesPerDay: 1, note: "" },
      { weekFrom: 2, weekTo: 3, dailyDose: 30, dosesPerDay: 2, note: "" }
    ],
    escalation: { amount: 30, everyWeeks: 1 },
    maintenanceRange: [60, 120]
  }],
  cautions: [],
  sources: DEMO_SOURCE,
  dataVerified: false
}];

const DEMO_INTERACTION_CLASSES = {
  inducers:   [{ id: "demoInducerX",   nameCn: "演示诱导剂X" }],
  inhibitors: [{ id: "demoInhibitorY", nameCn: "演示抑制剂Y" }],
  neutral:    [{ id: "demoNeutralZ",   nameCn: "演示中性药Z" }]
};

/* =====================================================================
 * 四、当前生效的数据集（正式数据 + 可选演示数据）
 * ===================================================================== */
const ALL_DRUGS = DRUGS.filter(d => d.id).concat(LOAD_DEMO_DATA ? DEMO_DRUGS : []);
const ACTIVE_CLASSES = {
  inducers:   INTERACTION_CLASSES.inducers.concat(LOAD_DEMO_DATA ? DEMO_INTERACTION_CLASSES.inducers : []),
  inhibitors: INTERACTION_CLASSES.inhibitors.concat(LOAD_DEMO_DATA ? DEMO_INTERACTION_CLASSES.inhibitors : []),
  neutral:    INTERACTION_CLASSES.neutral.concat(LOAD_DEMO_DATA ? DEMO_INTERACTION_CLASSES.neutral : [])
};

/* =====================================================================
 * 五、计算核心（纯函数，不碰 DOM、不读全局数据，所有输入经参数传入）
 * ===================================================================== */

// ---- 通用小工具 ----
function isPos(x) { return typeof x === "number" && isFinite(x) && x > 0; }
function r4(x) { return Math.round(x * 1e4) / 1e4; }            // 消除浮点尾差
function fmtNum(x) { return String(r4(x)); }
function gcd(a, b) { while (b) { const t = a % b; a = b; b = t; } return a; }
// mg → 整数单位（千分之一 mg），避免小数剂量的浮点误差；精度超过 3 位小数返回 null
function toUnits(mg) { const u = Math.round(mg * 1000); return Math.abs(u - mg * 1000) < 1e-6 ? u : null; }

/**
 * 1. 情境判定：根据合并用药决定采用目标药物的哪条 titrationPath。
 * @param {string[]} concomitantIds 合并用药 id 列表（空数组 = 单药）
 * @param {{inducers:Array, inhibitors:Array, neutral:Array}} classes 药物分类表
 * @param {object} drug 目标药物
 * @returns {{
 *   scenario: string|null,   // 判定出的情境；需人工判断时为 null
 *   path: object|null,       // 对应的 titrationPath；需人工判断时为 null
 *   needsManual: boolean,    // true = 程序不自动选，交医生决定
 *   basis: string,           // 中文判定依据，显示在医生版
 *   matched: {inducers:string[], inhibitors:string[], neutral:string[], unknown:string[]}
 * }}
 */
function resolveScenario(concomitantIds, classes, drug) {
  const ids = Array.isArray(concomitantIds) ? concomitantIds : [];
  const matched = { inducers: [], inhibitors: [], neutral: [], unknown: [] };
  const nameOf = {};
  ids.forEach(id => {
    let hit = false;
    ["inducers", "inhibitors", "neutral"].forEach(k => {
      const item = ((classes && classes[k]) || []).find(c => c.id === id);
      if (item) { matched[k].push(id); nameOf[id] = item.nameCn; hit = true; }
    });
    if (!hit) { matched.unknown.push(id); nameOf[id] = id; }
  });
  const names = list => list.map(id => nameOf[id]).join("、");
  const manual = basis => ({ scenario: null, path: null, needsManual: true, basis, matched });

  // 规则 1：有任何未分类的合并用药 → 不猜，交医生
  if (matched.unknown.length)
    return manual("合用药「" + names(matched.unknown) + "」不在药物分类表中，无法判定情境，需人工判断");
  // 规则 2：诱导剂与抑制剂并存 → 不自动选
  if (matched.inducers.length && matched.inhibitors.length)
    return manual("同时合用酶诱导剂（" + names(matched.inducers) + "）和酶抑制剂（" + names(matched.inhibitors) + "），需人工判断");

  let scenario, why;
  if (matched.inducers.length) { scenario = "withInducer"; why = "检测到合用 " + names(matched.inducers) + "（酶诱导剂）"; }
  else if (matched.inhibitors.length) { scenario = "withInhibitor"; why = "检测到合用 " + names(matched.inhibitors) + "（酶抑制剂）"; }
  else if (matched.neutral.length) { scenario = "monotherapy"; why = "合用 " + names(matched.neutral) + "（归类为无相互作用）"; }
  else { scenario = "monotherapy"; why = "未合用其他药物"; }

  const path = ((drug && drug.titrationPaths) || []).find(p => p.scenario === scenario) || null;
  // 规则 3：目标药没有该情境的方案数据 → 交医生
  if (!path) return manual(why + "，但" + ((drug && drug.nameCn) || "该药") + "没有对应情境（" + scenario + "）的方案数据，需人工判断");
  return { scenario, path, needsManual: false, basis: why + "，采用「" + path.label + "」方案", matched };
}

/**
 * 2. 展开滴定序列：固定步骤 → 按 escalation 递增 → 到达目标剂量后维持。
 * @param {object} path 一条 titrationPath
 * @param {number} targetDose 目标日剂量(mg)
 * @returns {{
 *   ok: boolean,
 *   segments: Array<{weekFrom:number, weekTo:number|null, dailyDose:number, dosesPerDay:number, note:string}>,
 *                          // 最后一段 weekTo 为 null，表示"自该周起维持"
 *   warnings: string[],    // 可生成但需提醒医生的事项
 *   error: string          // ok=false 时的原因
 * }}
 */
function expandSchedule(path, targetDose) {
  const fail = error => ({ ok: false, segments: [], warnings: [], error });
  if (!isPos(targetDose)) return fail("目标剂量未填写或非法");
  const steps = path && path.steps;
  if (!Array.isArray(steps) || !steps.length) return fail("该方案的滴定步骤数据未填写");

  // 逐步校验：任何一项为 null 或不合理都拒绝计算（最后一步的 weekTo 允许为 null，表示不再递增）
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i], isLast = i === steps.length - 1;
    const weekToOk = Number.isInteger(s.weekTo) ? s.weekTo >= s.weekFrom : (isLast && s.weekTo === null);
    if (!Number.isInteger(s.weekFrom) || !weekToOk || !isPos(s.dailyDose) || !Number.isInteger(s.dosesPerDay) || s.dosesPerDay < 1)
      return fail("该方案第 " + (i + 1) + " 步数据未填写或非法");
    if (s.weekFrom !== (i === 0 ? 1 : steps[i - 1].weekTo + 1)) return fail("该方案第 " + (i + 1) + " 步的周次与上一步不连续");
    if (i > 0 && s.dailyDose < steps[i - 1].dailyDose) return fail("该方案第 " + (i + 1) + " 步剂量低于上一步，本版只支持递增滴定");
  }
  if (targetDose < steps[0].dailyDose)
    return fail("目标剂量 " + fmtNum(targetDose) + " mg 低于该方案起始剂量 " + fmtNum(steps[0].dailyDose) + " mg，请核对");

  const warnings = [], segments = [];
  const range = Array.isArray(path.maintenanceRange) ? path.maintenanceRange : [];
  if (isPos(range[1]) && targetDose > range[1]) warnings.push("目标剂量 " + fmtNum(targetDose) + " mg 超出维持剂量范围上限 " + fmtNum(range[1]) + " mg");
  if (isPos(range[0]) && targetDose < range[0]) warnings.push("目标剂量 " + fmtNum(targetDose) + " mg 低于维持剂量范围下限 " + fmtNum(range[0]) + " mg");
  const seg = (weekFrom, weekTo, dailyDose, dosesPerDay, note) => segments.push({ weekFrom, weekTo, dailyDose, dosesPerDay, note: note || "" });
  const capWarn = (week, planned) => warnings.push("第 " + week + " 周起按目标剂量封顶为 " + fmtNum(targetDose) + " mg（方案原定该步为 " + fmtNum(planned) + " mg）");

  // 阶段一：固定步骤。遇到第一个 ≥ 目标剂量的步即封顶并维持
  for (const s of steps) {
    if (s.dailyDose >= targetDose) {
      if (s.dailyDose > targetDose) capWarn(s.weekFrom, s.dailyDose);
      seg(s.weekFrom, null, targetDose, s.dosesPerDay, s.note);
      return { ok: true, segments, warnings, error: "" };
    }
    seg(s.weekFrom, s.weekTo, s.dailyDose, s.dosesPerDay, s.note);
  }

  // 阶段二：按 escalation 递增到目标剂量（分次数沿用最后一个固定步）
  const last = steps[steps.length - 1], e = path.escalation || {};
  if (last.weekTo === null) return fail("目标剂量高于方案最高剂量，且最后一步未写结束周，无法继续递增");
  if (!isPos(e.amount) || !Number.isInteger(e.everyWeeks) || e.everyWeeks < 1)
    return fail("目标剂量高于固定步骤的最高剂量，但该方案未填写递增规则");
  let dose = last.dailyDose, week = last.weekTo + 1;
  for (let n = 0; ; n++) {
    if (n >= 200) return fail("递增步数过多，请核对目标剂量与递增规则");
    const next = r4(dose + e.amount);
    if (next >= targetDose) {
      if (next > targetDose) capWarn(week, next);
      seg(week, null, targetDose, last.dosesPerDay, "");
      return { ok: true, segments, warnings, error: "" };
    }
    seg(week, week + e.everyWeeks - 1, next, last.dosesPerDay, "");
    dose = next; week += e.everyWeeks;
  }
}

/**
 * 3. 凑片：把"日剂量 + 分次"换算成可执行的片数组合。本工具的核心价值所在。
 * @param {number} dailyDose 日剂量(mg)
 * @param {number} dosesPerDay 每日次数
 * @param {number[]} strengths 可用规格(mg)
 * @param {boolean} splittable 可否掰半
 * @param {boolean} allowAlternateDay 可否隔日服
 * @returns {{
 *   ok: boolean,
 *   mode: "daily"|"alternateDay",   // alternateDay = 隔日服一次
 *   doses: Array<{mg:number, pieces:Array<{strength:number, count:number}>}>,
 *                          // 每次服药的组合；count 可为 0.5 的倍数；隔日模式下只有 1 项
 *   usesHalf: boolean,     // 是否用到半片
 *   reason: string         // ok=false 时的原因，如"该剂量无法用现有规格凑出"
 * }}
 */
function fitToTablets(dailyDose, dosesPerDay, strengths, splittable, allowAlternateDay) {
  const fail = reason => ({ ok: false, mode: null, doses: [], usesHalf: false, reason });
  // 任何输入缺失（含 null）都拒绝计算
  if (!isPos(dailyDose) || !Number.isInteger(dosesPerDay) || dosesPerDay < 1 ||
      !Array.isArray(strengths) || !strengths.length || !strengths.every(isPos) ||
      typeof splittable !== "boolean" || typeof allowAlternateDay !== "boolean")
    return fail("剂量、规格或可否掰半/隔日的数据缺失，无法凑片");
  const D = toUnits(dailyDose);
  const S = Array.from(new Set(strengths)).sort((a, b) => b - a).map(mg => ({ mg, u: toUnits(mg) })); // 规格从大到小
  if (D === null || S.some(x => x.u === null)) return fail("剂量或规格的小数位超过 3 位，无法凑片");

  const done = (mode, mg, pieces) => ({
    ok: true, mode,
    doses: Array.from({ length: mode === "daily" ? dosesPerDay : 1 }, () => ({ mg: r4(mg), pieces: pieces.map(p => ({ strength: p.strength, count: p.count })) })),
    usesHalf: pieces.some(p => p.count % 1 !== 0), reason: ""
  });

  // 每日服：日剂量等分到各次，每次剂量相同
  if (D % dosesPerDay === 0) {
    const pieces = fitOneDose(D / dosesPerDay, S, splittable);
    if (pieces) return done("daily", dailyDose / dosesPerDay, pieces);
  }
  // 隔日服：仅当 允许隔日 + 每日 1 次 + 日剂量低于最小可服剂量 + 两倍日剂量能凑出
  const minTake = S[S.length - 1].u / (splittable ? 2 : 1);
  if (allowAlternateDay && dosesPerDay === 1 && D < minTake) {
    const pieces = fitOneDose(D * 2, S, splittable);
    if (pieces) return done("alternateDay", dailyDose * 2, pieces);
  }
  return fail("该剂量无法用现有规格凑出（每次需 " + fmtNum(dailyDose / dosesPerDay) + " mg；现有规格 " +
    S.map(x => fmtNum(x.mg)).join("/") + " mg，" + (splittable ? "可掰半" : "不可掰") + "）");
}

// 凑出单次剂量。优先级：整片优先于半片 → 单一规格优先于混用 → 片数最少。无解返回 null
// dose 与 S[i].u 均为整数单位；S 已按规格从大到小排序
function fitOneDose(dose, S, splittable) {
  // ① 单一规格、整片：能整除的最大规格片数最少
  for (const x of S) if (dose % x.u === 0) return [{ strength: x.mg, count: dose / x.u }];
  // ② 多规格混用、整片
  const whole = S.map(x => ({ size: x.u, strength: x.mg, part: 1 }));
  const mixed = minPieces(dose, whole);
  if (mixed) return mixed;
  if (!splittable) return null;
  // ③ 单一规格、含半片
  for (const x of S) if (dose % (x.u / 2) === 0) return [{ strength: x.mg, count: dose / x.u }];
  // ④ 多规格混用、含半片
  return minPieces(dose, whole.concat(S.map(x => ({ size: x.u / 2, strength: x.mg, part: 0.5 }))));
}

// 完全背包：用给定片块凑出 dose 的最少块数组合，返回 [{strength, count}]（规格从大到小），无解返回 null
function minPieces(dose, coins) {
  const g = coins.reduce((acc, c) => gcd(acc, c.size), dose), n = dose / g;
  if (n > 100000) return null; // 防御：规模异常时不算
  const best = new Array(n + 1).fill(Infinity), from = new Array(n + 1).fill(-1);
  best[0] = 0;
  for (let v = 1; v <= n; v++) coins.forEach((c, i) => {
    const sz = c.size / g;
    if (sz <= v && best[v - sz] + 1 < best[v]) { best[v] = best[v - sz] + 1; from[v] = i; }
  });
  if (best[n] === Infinity) return null;
  const cnt = new Map();
  for (let v = n; v > 0; v -= coins[from[v]].size / g) {
    const c = coins[from[v]];
    cnt.set(c.strength, (cnt.get(c.strength) || 0) + c.part);
  }
  return Array.from(cnt.keys()).sort((a, b) => b - a).map(k => ({ strength: k, count: cnt.get(k) }));
}

/**
 * 4. 排日历：把带凑片结果的周序列映射到真实日期。
 * @param {Array} schedule expandSchedule 的 segments，每段附加 fit（fitToTablets 的结果）
 * @param {string} startDate 起始日期 "YYYY-MM-DD"
 * @param {number} days 需要排出的天数
 * @returns {{
 *   ok: boolean,
 *   days: Array<{
 *     date: string,          // "YYYY-MM-DD"
 *     dayNo: number,         // 第几天（从 1 起）
 *     week: number,          // 第几周（从 1 起）
 *     mg: number,            // 当天实际服用的总量(mg)，停药日为 0
 *     slots: {"早":Array|null, "中":Array|null, "晚":Array|null}, // 各时段的 pieces，不服为 null
 *     skip: boolean,         // 隔日方案中"今天不吃药"的那天
 *     isChangeDay: boolean   // 剂量变化的第一天（"今天开始加量"）
 *   }>,
 *   error: string
 * }}
 */
// 每日次数 → 服药时段
const SLOT_MAP = { 1: ["早"], 2: ["早", "晚"], 3: ["早", "中", "晚"] };

function toCalendar(schedule, startDate, days) {
  const fail = error => ({ ok: false, days: [], error });
  if (!Array.isArray(schedule) || !schedule.length) return fail("没有可排的滴定序列");
  if (!Number.isInteger(days) || days < 1 || days > 3660) return fail("天数非法");
  // 日期一律按 UTC 零点做整天加减，避开时区和夏令时
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(startDate || "");
  const base = m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
  const iso = t => new Date(t).toISOString().slice(0, 10);
  if (isNaN(base) || iso(base) !== startDate) return fail("起始日期非法");
  // 只要有一段凑不出片，就整体拒绝，绝不给患者一张有缺口的日历
  for (const s of schedule) {
    if (!s.fit || !s.fit.ok) return fail("第 " + s.weekFrom + " 周起的剂量无法凑片：" + ((s.fit && s.fit.reason) || "缺少凑片结果"));
    if (!SLOT_MAP[s.fit.doses.length]) return fail("第 " + s.weekFrom + " 周起每日 " + s.fit.doses.length + " 次，本版只支持每日 1–3 次");
  }

  const out = [];
  for (let i = 0; i < days; i++) {
    const week = Math.floor(i / 7) + 1;
    const k = schedule.findIndex(s => s.weekFrom <= week && (s.weekTo === null || week <= s.weekTo));
    if (k < 0) return fail("第 " + week + " 周没有对应的剂量段");
    const s = schedule[k], prev = schedule[k - 1], dayInSeg = i - (s.weekFrom - 1) * 7;
    const skip = s.fit.mode === "alternateDay" && dayInSeg % 2 === 1; // 隔日：从该段第一天起，服、停、服、停…
    const slots = { "早": null, "中": null, "晚": null };
    let mg = 0;
    if (!skip) SLOT_MAP[s.fit.doses.length].forEach((slot, j) => {
      slots[slot] = s.fit.doses[j].pieces.map(p => ({ strength: p.strength, count: p.count }));
      mg += s.fit.doses[j].mg;
    });
    const isChangeDay = dayInSeg === 0 && !!prev &&
      (prev.dailyDose !== s.dailyDose || prev.dosesPerDay !== s.dosesPerDay || prev.fit.mode !== s.fit.mode);
    out.push({ date: iso(base + i * 86400000), dayNo: i + 1, week, mg: r4(mg), slots, skip, isChangeDay });
  }
  return { ok: true, days: out, error: "" };
}

/**
 * 把带凑片结果的周序列格式化成规范文本行（医生版表格与 FIXTURES 逐字比对共用）。
 * @returns {string[]} 例："第1–2周｜日剂量 10 mg｜每日 1 次｜每次 10 mg 片 × 1"
 */
function formatScheduleLines(schedule) {
  return schedule.map(s => {
    const weeks = s.weekTo === null ? "第" + s.weekFrom + "周起"
      : s.weekTo === s.weekFrom ? "第" + s.weekFrom + "周" : "第" + s.weekFrom + "–" + s.weekTo + "周";
    const f = s.fit;
    if (!f || !f.ok)
      return [weeks, "日剂量 " + fmtNum(s.dailyDose) + " mg", "每日 " + s.dosesPerDay + " 次", "无法凑片：" + ((f && f.reason) || "缺少凑片结果")].join("｜");
    const alt = f.mode === "alternateDay";
    return [weeks,
      (alt ? "折合日剂量 " : "日剂量 ") + fmtNum(s.dailyDose) + " mg",
      alt ? "隔日 1 次" : "每日 " + s.dosesPerDay + " 次",
      "每次 " + f.doses[0].pieces.map(p => fmtNum(p.strength) + " mg 片 × " + fmtNum(p.count)).join(" + ")
    ].join("｜");
  });
}

/* =====================================================================
 * 六、页内测试（?test=1 显示）
 * ===================================================================== */
const TESTS = [];
function test(group, name, fn) { TESTS.push({ group, name, fn }); }
function eq(actual, expected) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error("期望 " + e + "，实际 " + a);
}
// 取演示药的某条路径
function demoPath(drugId, scenario) {
  return DEMO_DRUGS.find(d => d.id === drugId).titrationPaths.find(p => p.scenario === scenario);
}
// 把 segments 压成 [起始周, 结束周, 日剂量, 次数] 便于比对
function segBrief(r) { return r.ok ? r.segments.map(s => [s.weekFrom, s.weekTo, s.dailyDose, s.dosesPerDay]) : "失败"; }
// 把凑片结果压成字符串，如 "daily:1x20" / "daily:0.5x10|0.5x10" / "alternateDay:1x20"
function fitBrief(r) {
  if (!r.ok) return "无法凑出";
  return r.mode + ":" + r.doses.map(d => d.pieces.map(p => p.count + "x" + p.strength).join("+")).join("|");
}
// 构造一个"每次 n 片某规格"的凑片结果，供 toCalendar 测试用
function mkFit(mode, perDay, strength, count) {
  const one = { mg: strength * count, pieces: [{ strength, count }] };
  return { ok: true, mode, doses: Array.from({ length: perDay }, () => one), usesHalf: count % 1 !== 0, reason: "" };
}

/* ---------- formatScheduleLines ---------- */
test("文本行", "隔日、半片、凑不出三种情形的写法", () => {
  const mk = (weekFrom, weekTo, dailyDose, dosesPerDay, st, sp, alt) =>
    ({ weekFrom, weekTo, dailyDose, dosesPerDay, note: "", fit: fitToTablets(dailyDose, dosesPerDay, st, sp, alt) });
  const lines = formatScheduleLines([mk(1, 2, 5, 1, [10], false, true), mk(3, 3, 15, 1, [30], true, false), mk(4, null, 15, 1, [20], false, false)]);
  eq(lines.slice(0, 2), ["第1–2周｜折合日剂量 5 mg｜隔日 1 次｜每次 10 mg 片 × 1", "第3周｜日剂量 15 mg｜每日 1 次｜每次 30 mg 片 × 0.5"]);
  eq(lines[2].startsWith("第4周起｜日剂量 15 mg｜每日 1 次｜无法凑片："), true);
});
test("文本行", "演示药A 单药目标 30：第 5 周起每次 15mg 凑不出，如实写出", () => {
  const sch = expandSchedule(MONO, 30);
  const lines = formatScheduleLines(sch.segments.map(s => Object.assign({}, s, { fit: fitToTablets(s.dailyDose, s.dosesPerDay, A.strengths, A.splittable, A.allowAlternateDay) })));
  eq([lines.length, lines[2].includes("无法凑片")], [3, true]);
});

/* ---------- FIXTURES：说明书标准滴定方案（待使用者填入），程序输出须与之逐字一致 ----------
 * 每条格式：
 * { name: "说明书××方案",            // 显示名
 *   source: "××说明书 版本/日期",      // 出处
 *   drugId: "", concomitant: [],      // 目标药 id、合并用药 id 列表
 *   targetDose: null,                 // 目标日剂量(mg)
 *   expectedLines: [] }               // 期望输出，逐行文本
 */
const FIXTURES = [];

// 演示 fixture：仅用于验证对照机制本身，数值虚构
const DEMO_FIXTURES = [{
  name: "演示：演示药A 单药，目标 40", source: "虚构", drugId: "demoA", concomitant: [], targetDose: 40,
  expectedLines: [
    "第1–2周｜日剂量 10 mg｜每日 1 次｜每次 10 mg 片 × 1",
    "第3–4周｜日剂量 20 mg｜每日 2 次｜每次 10 mg 片 × 1",
    "第5周起｜日剂量 40 mg｜每日 2 次｜每次 20 mg 片 × 1"
  ]
}];

// 跑一条 fixture，返回实际输出行（任何一步失败都如实写进输出，不吞错）
function runFixture(fx) {
  const drug = ALL_DRUGS.find(d => d.id === fx.drugId);
  if (!drug) return ["找不到药物：" + fx.drugId];
  try {
    const sc = resolveScenario(fx.concomitant, ACTIVE_CLASSES, drug);
    if (sc.needsManual) return ["需人工判断：" + sc.basis];
    const sch = expandSchedule(sc.path, fx.targetDose);
    if (!sch.ok) return ["无法生成：" + sch.error];
    return formatScheduleLines(sch.segments.map(s => Object.assign({}, s, {
      fit: fitToTablets(s.dailyDose, s.dosesPerDay, drug.strengths, drug.splittable, drug.allowAlternateDay)
    })));
  } catch (e) {
    return ["出错：" + e.message];
  }
}

/* ---------- 测试区渲染 ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function runTests() {
  let pass = 0, fail = 0;
  const rows = TESTS.map(t => {
    let st = "pass", msg = "";
    try { t.fn(); pass++; }
    catch (e) { st = "fail"; fail++; msg = e.message; }
    const label = { pass: "通过", fail: "失败" }[st];
    return "<tr><td>" + esc(t.group) + "</td><td>" + esc(t.name) +
      '</td><td class="st-' + st + '">' + label + "</td><td>" + esc(msg) + "</td></tr>";
  });
  const allGreen = fail === 0;
  document.getElementById("t-summary").innerHTML =
    '<div class="t-summary ' + (allGreen ? "ok" : "bad") + '">共 ' + TESTS.length + " 项：通过 " + pass +
    "，失败 " + fail + (allGreen ? "　✔ 全部通过" : "") + "</div>";
  document.getElementById("t-results").innerHTML =
    '<table class="t"><tr><th>分组</th><th>用例</th><th>结果</th><th>信息</th></tr>' + rows.join("") + "</table>";
}

function runFixtures() {
  const list = FIXTURES.concat(LOAD_DEMO_DATA ? DEMO_FIXTURES : []);
  let html = FIXTURES.length ? "" : '<div class="muted">FIXTURES 为空：待填入说明书标准滴定方案。下方仅为演示对照。</div>';
  list.forEach(fx => {
    const actual = runFixture(fx), n = Math.max(actual.length, fx.expectedLines.length);
    let same = actual.length === fx.expectedLines.length, left = "", right = "";
    for (let i = 0; i < n; i++) {
      const e = fx.expectedLines[i], a = actual[i], diff = e !== a;
      if (diff) same = false;
      left += '<div class="' + (diff ? "diff" : "") + '">' + esc(e === undefined ? "（无）" : e) + "</div>";
      right += '<div class="' + (diff ? "diff" : "") + '">' + esc(a === undefined ? "（无）" : a) + "</div>";
    }
    html += '<div class="card"><b>' + esc(fx.name) + '</b> <span class="muted">出处：' + esc(fx.source) + "</span> " +
      '<span class="' + (same ? "st-pass" : "st-fail") + '">' + (same ? "逐字一致" : "不一致") + "</span>" +
      '<div class="fx"><div><div class="muted">期望</div><pre>' + left + '</pre></div>' +
      '<div><div class="muted">实际</div><pre>' + right + "</pre></div></div></div>";
  });
  document.getElementById("fx-results").innerHTML = html;
}

/* =====================================================================
 * 七、启动
 * ===================================================================== */
document.getElementById("ver").textContent = TOOL_VERSION;
document.getElementById("demo-banner").hidden = !LOAD_DEMO_DATA;
if (new URLSearchParams(location.search).get("test") === "1") {
  document.getElementById("test-area").hidden = false;
  runTests();
  runFixtures();
}

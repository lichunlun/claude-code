# 复制本文件为 config/settings.toml 后修改。路径可用绝对路径；相对路径相对于项目目录。
# 环境变量 RCC_DATA_DIR / RCC_BACKUP_DIR 的优先级高于本文件。

[paths]
# data_dir = "D:/ResearchData/RCC"           # 数据库、日志、上传副本所在目录（默认：./data）
# backup_dir = "E:/Backup/RCC"               # 备份目录（默认：<data_dir>/backups）；建议放在另一块磁盘

[backup]
keep = 30              # 自动备份保留份数（手动备份与恢复前备份不会被自动清理）
interval_hours = 24    # 自动备份间隔（小时）；0 = 关闭自动备份

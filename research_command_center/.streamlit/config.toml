# Research Command Center —— Streamlit 配置
# 仅监听本机 127.0.0.1，不对局域网开放；关闭使用统计上报。

[server]
address = "127.0.0.1"
port = 8501
headless = false
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 300

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "viewer"

[runner]
magicEnabled = false

[theme]
base = "light"
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showSidebarBorder = true

[theme.light]
primaryColor = "#1d4f91"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eceff4"
textColor = "#1b2433"
borderColor = "#dfe3ea"
linkColor = "#1d4f91"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f3f7"

[theme.dark]
primaryColor = "#6ea8fe"
backgroundColor = "#0f1420"
secondaryBackgroundColor = "#1a2233"
textColor = "#e6e9ef"
borderColor = "#2a3448"
linkColor = "#8ab8ff"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#121a29"
secondaryBackgroundColor = "#1a2233"
